<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="description" content="AI-Powered Vehicle Damage Detection & Cost Estimation" />
    <title>AutoScan AI — Vehicle Damage Detector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Exo+2:ital,wght@0,300;0,400;0,600;0,800;1,400&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --neon-cyan: #00f5ff;
        --neon-orange: #ff6b35;
        --neon-green: #39ff14;
        --dark-bg: #050510;
        --card-bg: #0d0d2b;
        --glass: rgba(255, 255, 255, 0.04);
        --border: rgba(0, 245, 255, 0.15);
      }
      html { scroll-behavior: smooth; }
      body {
        background: var(--dark-bg);
        color: #e0e0ff;
        font-family: 'Exo 2', sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
      }
      #root { min-height: 100vh; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #0a0a1a; }
      ::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 3px; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
